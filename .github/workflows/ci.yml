name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macOS runner: only host that can compile and test the Apple targets.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test all targets
        run: ./gradlew build

      - name: Check public API surface
        run: ./gradlew checkLegacyAbi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  linux-targets:
    # linuxX64 compiles on macOS but its tests can only run on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test JVM, JS, Wasm and Linux targets
        run: ./gradlew jvmTest jsNodeTest wasmJsNodeTest linuxX64Test

  windows-targets:
    # mingwX64 tests can only run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test MinGW x64
        run: ./gradlew mingwX64Test
