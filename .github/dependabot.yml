# Dependabot cannot patch kotlin-js-store/yarn.lock on its own: that file is
# generated by the Kotlin/JS Gradle plugin and has no real npm manifest.
# A stub package.json lives next to the lockfile so security-update jobs can
# fetch the directory. Ignore every npm package so Dependabot does not open
# PRs that fight kotlinUpgradeYarnLock.
#
# Bump those toolchain transitives in the root build.gradle.kts YarnRootExtension
# resolutions, then run ./gradlew kotlinUpgradeYarnLock.

version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/kotlin-js-store"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
